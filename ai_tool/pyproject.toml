[project]
name = "ai-tool"
version = "0.1.0"
description = "AI 智能助手工具集：厨房助手、万年历、AI 伴侣"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "lunarcalendar>=0.0.9",
    "openai>=1.0.0",
    "requests>=2.34.2",
    "streamlit>=1.63.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
